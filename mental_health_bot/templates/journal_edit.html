{% extends "base.html" %}

{% block content %}
<div class="app-container" style="display: block; overflow-y: auto;">
    <div style="max-width: 800px; margin: 0 auto; padding: 2rem 1rem;">

        <form method="post">
            <!-- Header -->
            <div class="chat-header"
                style="border-radius: 16px; margin-bottom: 2rem; background: var(--glass-bg); backdrop-filter: blur(12px); display: flex; justify-content: space-between;">
                <input type="text" name="title" value="{{ entry.title if entry else '' }}"
                    placeholder="Title your thought..."
                    style="background: transparent; border: none; color: white; font-size: 1.5rem; font-weight: bold; width: 100%; outline: none;"
                    required>

                <div class="nav-actions">
                    <button type="submit" class="nav-link"
                        style="background: var(--primary); color: white; border: none; cursor: pointer;">
                        Save
                    </button>
                    <a href="{{ url_for('journal') }}" class="nav-link"
                        style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);">
                        Cancel
                    </a>
                </div>
            </div>

            <!-- Editor -->
            <div class="auth-box" style="width: 100%; max-width: none; padding: 0; overflow: hidden;">
                <textarea name="content" placeholder="Write your thoughts here..."
                    style="width: 100%; height: 60vh; background: transparent; border: none; padding: 2rem; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 1.1rem; line-height: 1.6; resize: none; outline: none; box-sizing: border-box;">{{ entry.content if entry else '' }}</textarea>
            </div>
        </form>
    </div>
</div>
{% endblock %}
