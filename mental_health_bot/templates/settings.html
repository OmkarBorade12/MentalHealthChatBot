{% extends "base.html" %}

{% block content %}
<div class="app-container" style="display: block; overflow-y: auto;">
    <div style="max-width: 600px; margin: 0 auto; padding: 2rem 1rem;">

        <!-- Header -->
        <div class="chat-header"
            style="border-radius: 16px; margin-bottom: 2rem; background: var(--glass-bg); backdrop-filter: blur(12px);">
            <div class="bot-info">
                <h1 style="font-size: 1.5rem; margin: 0; color: white;">Settings</h1>
            </div>
            <div class="nav-actions">
                <a href="{{ url_for('index') }}" class="nav-link"
                    style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);">
                    &larr; Back
                </a>
            </div>
        </div>

        <!-- Settings Form -->
        <div class="auth-box" style="width: 100%; max-width: none; padding: 2rem; box-sizing: border-box;">
            <form method="post">
                <h3
                    style="margin-top: 0; color: var(--text-primary); border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">
                    Preferences</h3>

                <div class="form-group" style="margin-top: 1.5rem;">
                    <label>Theme</label>
                    <select name="theme" class="form-input" style="background: rgba(0, 0, 0, 0.4);">
                        <option value="dark" {% if preferences.get('theme')=='dark' %}selected{% endif %}>Dark Mode
                            (Default)</option>
                        <option value="light" {% if preferences.get('theme')=='light' %}selected{% endif %}>Light Mode
                        </option>
                    </select>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" name="notifications" id="notif" {% if preferences.get('notifications')
                        %}checked{% endif %} style="width: 20px; height: 20px;">
                    <label for="notif" style="margin: 0; cursor: pointer;">Enable Daily Reminders</label>
                </div>

                <h3
                    style="margin-top: 2rem; color: var(--text-primary); border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">
                    Security</h3>

                <div class="form-group" style="margin-top: 1.5rem;">
                    <label>New Password (leave blank to keep current)</label>
                    <input type="password" name="new_password" class="form-input" placeholder="********">
                </div>

                <button type="submit" class="submit-btn">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
