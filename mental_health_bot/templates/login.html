{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-box">
        <h2 class="auth-title">Welcome Back</h2>
        <form method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-input" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-input" required>
            </div>
            <button type="submit" class="submit-btn" style="width: 100%">Login</button>
        </form>
        <p style="margin-top: 1.5rem; color: var(--text-secondary);">
            Don't have an account? <a href="{{ url_for('register') }}"
                style="color: var(--primary); text-decoration: none; font-weight: 500;">Register</a>
        </p>
    </div>
</div>
{% endblock %}
